services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      FORMFLOW_ENV: ${FORMFLOW_ENV:-production}
      FORMFLOW_ALLOW_REGISTRATION: ${FORMFLOW_ALLOW_REGISTRATION:-false}
      FORMFLOW_DATABASE_URL: ${FORMFLOW_DATABASE_URL:-sqlite:////srv/formflow/data/formflow.db}
      FORMFLOW_STORAGE_DIR: ${FORMFLOW_STORAGE_DIR:-/srv/formflow/data/storage}
      FORMFLOW_WORKER_HEARTBEAT_FILE: ${FORMFLOW_WORKER_HEARTBEAT_FILE:-/srv/formflow/data/storage/.worker-heartbeat}
      FORMFLOW_LLM_BASE_URL: ${FORMFLOW_LLM_BASE_URL:-https://your-provider.example/v1}
      FORMFLOW_LLM_MODEL: ${FORMFLOW_LLM_MODEL:-your-model}
      FORMFLOW_LLM_INPUT_MODE: ${FORMFLOW_LLM_INPUT_MODE:-auto}
      FORMFLOW_LLM_FALLBACK_MODEL: ${FORMFLOW_LLM_FALLBACK_MODEL:-}
      FORMFLOW_LLM_MAX_FILE_BYTES: ${FORMFLOW_LLM_MAX_FILE_BYTES:-20971520}
      FORMFLOW_MAX_PAGES_PER_RUN: ${FORMFLOW_MAX_PAGES_PER_RUN:-40}
      FORMFLOW_MAX_LLM_CALLS_PER_RUN: ${FORMFLOW_MAX_LLM_CALLS_PER_RUN:-30}
      FORMFLOW_LLM_TIMEOUT_SECONDS: ${FORMFLOW_LLM_TIMEOUT_SECONDS:-300}
      FORMFLOW_LLM_MAX_RETRIES: ${FORMFLOW_LLM_MAX_RETRIES:-2}
      FORMFLOW_SESSION_TTL_SECONDS: ${FORMFLOW_SESSION_TTL_SECONDS:-604800}
      FORMFLOW_MAX_OCR_PAGES_PER_FILE: ${FORMFLOW_MAX_OCR_PAGES_PER_FILE:-20}
      FORMFLOW_OCR_TIME_BUDGET_SECONDS: ${FORMFLOW_OCR_TIME_BUDGET_SECONDS:-120}
      FORMFLOW_LLM_API_KEY_FILE: /run/secrets/formflow_llm_api_key
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - formflow_data:/srv/formflow/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    secrets:
      - formflow_llm_api_key

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      FORMFLOW_ENV: ${FORMFLOW_ENV:-production}
      FORMFLOW_ALLOW_REGISTRATION: ${FORMFLOW_ALLOW_REGISTRATION:-false}
      FORMFLOW_DATABASE_URL: ${FORMFLOW_DATABASE_URL:-sqlite:////srv/formflow/data/formflow.db}
      FORMFLOW_STORAGE_DIR: ${FORMFLOW_STORAGE_DIR:-/srv/formflow/data/storage}
      FORMFLOW_WORKER_HEARTBEAT_FILE: ${FORMFLOW_WORKER_HEARTBEAT_FILE:-/srv/formflow/data/storage/.worker-heartbeat}
      FORMFLOW_LLM_BASE_URL: ${FORMFLOW_LLM_BASE_URL:-https://your-provider.example/v1}
      FORMFLOW_LLM_MODEL: ${FORMFLOW_LLM_MODEL:-your-model}
      FORMFLOW_LLM_INPUT_MODE: ${FORMFLOW_LLM_INPUT_MODE:-auto}
      FORMFLOW_LLM_FALLBACK_MODEL: ${FORMFLOW_LLM_FALLBACK_MODEL:-}
      FORMFLOW_LLM_MAX_FILE_BYTES: ${FORMFLOW_LLM_MAX_FILE_BYTES:-20971520}
      FORMFLOW_MAX_PAGES_PER_RUN: ${FORMFLOW_MAX_PAGES_PER_RUN:-40}
      FORMFLOW_MAX_LLM_CALLS_PER_RUN: ${FORMFLOW_MAX_LLM_CALLS_PER_RUN:-30}
      FORMFLOW_LLM_TIMEOUT_SECONDS: ${FORMFLOW_LLM_TIMEOUT_SECONDS:-300}
      FORMFLOW_LLM_MAX_RETRIES: ${FORMFLOW_LLM_MAX_RETRIES:-2}
      FORMFLOW_SESSION_TTL_SECONDS: ${FORMFLOW_SESSION_TTL_SECONDS:-604800}
      FORMFLOW_MAX_OCR_PAGES_PER_FILE: ${FORMFLOW_MAX_OCR_PAGES_PER_FILE:-20}
      FORMFLOW_OCR_TIME_BUDGET_SECONDS: ${FORMFLOW_OCR_TIME_BUDGET_SECONDS:-120}
      FORMFLOW_LLM_API_KEY_FILE: /run/secrets/formflow_llm_api_key
    command: ["python", "-m", "app.worker"]
    volumes:
      - formflow_data:/srv/formflow/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import os, time; p=Path(os.environ['FORMFLOW_WORKER_HEARTBEAT_FILE']); raise SystemExit(0 if p.exists() and time.time() - p.stat().st_mtime < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    secrets:
      - formflow_llm_api_key

secrets:
  formflow_llm_api_key:
    file: ../.formflow_llm_api_key

volumes:
  formflow_data:
