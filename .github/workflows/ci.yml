name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep the Linux image stable; ubuntu-latest is moving to Ubuntu 26.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Generate parser fixtures
        run: python scripts/make_samples.py
      - name: Verify parser fixtures
        run: python scripts/check_samples.py
      - name: Run Python tests
        run: python -X tracemalloc=5 -W error::ResourceWarning -m pytest -o filterwarnings=error::pytest.PytestUnraisableExceptionWarning -q
      - name: Run frontend contract tests
        run: node --test tests/frontend_contracts.test.cjs tests/ux_browser.test.cjs
      - name: Check frontend syntax
        run: node --check app/static/app.js
      - name: Check browser walkthrough syntax
        run: >-
          node -e 'const { readdirSync } = require("node:fs"); const { spawnSync } = require("node:child_process");
          for (const file of readdirSync("scripts").filter((name) => (name.startsWith("ux_") || name === "showcase_check.cjs") && name.endsWith(".cjs"))) {
            const result = spawnSync(process.execPath, ["--check", `scripts/${file}`], { stdio: "inherit" });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }'

  docker:
    name: Docker Compose smoke test
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create empty model secret for offline smoke test
        run: |
          : > .formflow_llm_api_key
      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build deployment images
        run: docker compose -f deploy/docker-compose.yml build
      - name: Initialize deployment account
        run: |
          printf 'password1\npassword1\n' | \
            docker compose -f deploy/docker-compose.yml run --rm api \
              python scripts/create_account.py --username organizer --password-stdin
      - name: Start API and worker
        run: docker compose -f deploy/docker-compose.yml up -d
      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color api worker
          exit 1
      - name: Verify API response headers
        run: |
          curl --fail --silent --show-error \
            --dump-header /tmp/formflow-health-headers \
            --output /dev/null \
            http://127.0.0.1:8000/api/health
          grep -Fqi "x-content-type-options: nosniff" /tmp/formflow-health-headers
          grep -Fqi "x-frame-options: sameorigin" /tmp/formflow-health-headers
          grep -Fqi "cache-control: no-store" /tmp/formflow-health-headers
          grep -Fqi "permissions-policy: camera=(), microphone=(), geolocation=()" /tmp/formflow-health-headers
      - name: Verify initialized account login
        run: |
          curl --fail --silent --show-error \
            --data "username=organizer" \
            --data "password=password1" \
            http://127.0.0.1:8000/api/auth/login | grep -F '"token"'
      - name: Verify worker readiness
        run: |
          for attempt in {1..15}; do
            if docker compose -f deploy/docker-compose.yml logs --no-color worker | grep -Fq "[worker] ready"; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color worker
          exit 1
      - name: Show deployment logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color api worker
      - name: Tear down deployment
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
